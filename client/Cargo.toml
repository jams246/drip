[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "drip_client"
path = "src/lib.rs"

[[bin]]
name = "drip"
path = "src/main.rs"

[build-dependencies]
embed-resource = "=3.0.12"

[dependencies]
blake3 = { workspace = true }
clap = { workspace = true }
drip_core = { package = "core", path = "../core" }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["native-tls"] }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[target.'cfg(windows)'.dependencies]
chrono = "=0.4.45"
gpui = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "37faef81f74fc1bb08be9939c4cffc8ede6ced2f", default-features = false }
notify = "=8.2.1"
raw-window-handle = "=0.6.2"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tray-icon = { version = "=0.26.1", default-features = false }
unicode-segmentation = "=1.13.3"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
