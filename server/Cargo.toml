[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "drip_server"

[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
blake3.workspace = true
clap.workspace = true
drip_core = { package = "core", path = "../core" }
getrandom = "=0.4.3"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["server-graceful", "service", "tokio", "http1"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[dev-dependencies]
futures-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true
