[workspace]
members = ["core", "server", "client"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "stream"] }
url = "=2.5.8"
windows = "=0.62.2"
rpassword = "=7.5.4"
clap = { version = "=4.6.7", features = ["derive"] }
blake3 = "=1.8.7"
futures-util = "=0.3.34"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
